name: "✨ Feature Request / 功能建议"
description: "提出经过背景说明的改进建议"
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: "希望解决的问题 / Problem"
      description: "描述当前痛点，而不只是某个实现方案"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives"
  - type: textarea
    id: acceptance
    attributes:
      label: "验收标准 / Acceptance criteria"
  - type: checkboxes
    id: checklist
    attributes:
      label: "提交前确认 / Checklist"
      options:
        - label: "我已经搜索已有 Issue 和 PR，避免重复。"
          required: true
